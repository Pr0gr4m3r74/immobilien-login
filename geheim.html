<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interne Immobilienplattform hinter Login.">
  <title>Dashboard – Private Immobilienplattform</title>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="theme.js"></script>
  <script>
    if (!window.App || !window.App.requireSession()) {
      window.location.replace('index.html');
    } else {
      document.documentElement.classList.add('session-ok');
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="properties.js" defer></script>
  <script src="portal.js" defer></script>
</head>
<body class="portal-page">
  <header class="shell-header">
    <a class="brand-mark" href="#dashboard">
      <span class="brand-mark__logo">⌂</span>
      <div>
        <strong>Private Immobilienplattform</strong>
        <small data-i18n="portal.kicker"></small>
      </div>
    </a>

    <button type="button" class="icon-button mobile-only" id="menuToggle" data-i18n-aria-label="common.menu">☰</button>

    <nav class="header-nav" id="navMenu">
      <a href="#dashboard" data-i18n="common.dashboard"></a>
      <a href="#immobilien" data-i18n="common.properties"></a>
      <a href="#objekt-erstellen" class="admin-only" data-i18n="common.createProperty"></a>
      <button type="button" class="button button--ghost" id="themeToggle" data-theme-toggle>
        <span>◐</span>
        <span data-theme-label></span>
      </button>
      <label class="language-switch">
        <span data-i18n="common.language"></span>
        <select data-language-select>
          <option value="de">DE</option>
          <option value="en">EN</option>
        </select>
      </label>
      <button type="button" class="button button--ghost" data-logout data-i18n="common.logout"></button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="hero-panel" id="dashboard">
      <div class="hero-panel__copy">
        <span class="pill" data-i18n="portal.heroBadge"></span>
        <p class="eyebrow" data-i18n="portal.kicker"></p>
        <h1 data-i18n="portal.title"></h1>
        <p class="hero-panel__subline" data-i18n="portal.subtitle"></p>
        <div class="hero-panel__actions">
          <button type="button" class="button button--primary admin-only" id="quickAction" data-i18n="portal.quickAction"></button>
          <span class="role-badge" id="roleBadge"></span>
        </div>
      </div>
      <div class="hero-panel__stats">
        <article class="stat-card">
          <span data-i18n="portal.statTotal"></span>
          <strong id="statTotalValue">0</strong>
        </article>
        <article class="stat-card">
          <span data-i18n="portal.statVisible"></span>
          <strong id="statVisibleValue">0</strong>
        </article>
        <article class="stat-card">
          <span data-i18n="portal.statCities"></span>
          <strong id="statCitiesValue">0</strong>
        </article>
      </div>
    </section>

    <section class="panel search-panel">
      <div class="section-heading section-heading--centered">
        <p class="eyebrow" data-i18n="common.search"></p>
        <h2 data-i18n="portal.searchTitle"></h2>
        <p data-i18n="portal.searchSubtitle"></p>
      </div>
      <form id="searchForm" class="stack-lg">
        <div class="search-bar-row">
          <input id="searchInput" type="search" data-i18n-placeholder="portal.searchPlaceholder">
          <button type="submit" class="button button--primary" data-i18n="common.search"></button>
        </div>
        <div class="filter-grid">
          <div class="field-group">
            <label for="cityFilter" data-i18n="portal.city"></label>
            <input id="cityFilter" type="text" list="citySuggestions" data-i18n-placeholder="portal.cityPlaceholder">
            <datalist id="citySuggestions"></datalist>
          </div>
          <div class="field-group">
            <label for="minPrice" data-i18n="portal.minPrice"></label>
            <input id="minPrice" type="number" min="0">
          </div>
          <div class="field-group">
            <label for="maxPrice" data-i18n="portal.maxPrice"></label>
            <input id="maxPrice" type="number" min="0">
          </div>
          <div class="field-group">
            <label for="roomsFilter" data-i18n="portal.rooms"></label>
            <input id="roomsFilter" type="number" min="0" step="1">
          </div>
        </div>
        <div class="panel-actions">
          <p class="results-info" id="resultsInfo"></p>
          <button type="button" class="button button--ghost" id="resetFilters" data-i18n="common.resetFilters"></button>
        </div>
      </form>
    </section>

    <section class="panel" id="immobilien">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="common.properties"></p>
          <h2 data-i18n="portal.resultsTitle"></h2>
          <p data-i18n="portal.resultsSubtitle"></p>
        </div>
      </div>
      <div class="property-grid" id="propertyGrid"></div>
    </section>

    <section class="panel admin-only" id="objekt-erstellen">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="common.createProperty"></p>
          <h2 data-i18n="portal.adminTitle"></h2>
          <p data-i18n="portal.adminSubtitle"></p>
        </div>
      </div>

      <form id="propertyForm" class="admin-form stack-lg">
        <div class="form-grid form-grid--two">
          <div class="field-group">
            <label for="fieldTitle" data-i18n="portal.fieldTitle"></label>
            <input id="fieldTitle" type="text">
          </div>
          <div class="field-group">
            <label for="fieldCity" data-i18n="portal.fieldCity"></label>
            <input id="fieldCity" type="text">
          </div>
          <div class="field-group form-grid__span">
            <label for="fieldAddress" data-i18n="portal.fieldAddress"></label>
            <input id="fieldAddress" type="text">
          </div>
          <div class="field-group">
            <label for="fieldPrice" data-i18n="portal.fieldPrice"></label>
            <input id="fieldPrice" type="number" min="0">
          </div>
          <div class="field-group">
            <label for="fieldRooms" data-i18n="portal.fieldRooms"></label>
            <input id="fieldRooms" type="number" min="0" step="1">
          </div>
          <div class="field-group">
            <label for="fieldArea" data-i18n="portal.fieldArea"></label>
            <input id="fieldArea" type="number" min="0">
          </div>
          <div class="field-group">
            <label for="fieldType" data-i18n="portal.fieldType"></label>
            <select id="fieldType">
              <option value="apartment" data-i18n="propertyType.apartment"></option>
              <option value="penthouse" data-i18n="propertyType.penthouse"></option>
              <option value="townhouse" data-i18n="propertyType.townhouse"></option>
              <option value="loft" data-i18n="propertyType.loft"></option>
            </select>
          </div>
          <div class="field-group">
            <label for="fieldStatus" data-i18n="portal.fieldStatus"></label>
            <select id="fieldStatus">
              <option value="available" data-i18n="propertyStatus.available"></option>
              <option value="reserved" data-i18n="propertyStatus.reserved"></option>
              <option value="new" data-i18n="propertyStatus.new"></option>
            </select>
          </div>
          <div class="field-group form-grid__span">
            <label for="fieldFeatures" data-i18n="portal.fieldFeatures"></label>
            <input id="fieldFeatures" type="text">
          </div>
        </div>

        <div class="field-group">
          <label data-i18n="portal.editorLabel"></label>
          <div class="editor-toolbar">
            <button type="button" class="button button--ghost button--sm" data-editor-cmd="bold" data-i18n="portal.toolbarBold"></button>
            <button type="button" class="button button--ghost button--sm" data-editor-cmd="italic" data-i18n="portal.toolbarItalic"></button>
            <button type="button" class="button button--ghost button--sm" data-editor-cmd="insertUnorderedList" data-i18n="portal.toolbarList"></button>
          </div>
          <div id="descriptionEditor" class="rich-editor" contenteditable="true"></div>
        </div>

        <div class="form-grid form-grid--two">
          <div class="field-group">
            <label for="fieldFiles" data-i18n="portal.fieldFiles"></label>
            <input id="fieldFiles" type="file" accept="image/*" multiple>
          </div>
          <div class="field-group">
            <label for="fieldImages" data-i18n="portal.fieldImages"></label>
            <textarea id="fieldImages" rows="3"></textarea>
          </div>
        </div>

        <div class="field-group">
          <p class="hint-text" data-i18n="portal.imageHint"></p>
          <div class="image-preview-grid" id="imagePreview"></div>
        </div>

        <div class="panel-actions">
          <p class="form-feedback" id="formFeedback"></p>
          <div class="button-grid button-grid--auto">
            <button type="button" class="button button--ghost" id="exportProperties" data-i18n="common.export"></button>
            <button type="submit" class="button button--primary" id="formSubmit" data-i18n="common.createProperty"></button>
            <button type="button" class="button button--ghost" id="formCancel" hidden data-i18n="common.cancel"></button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <div class="modal" id="propertyModal" hidden>
    <div class="modal-dialog">
      <button type="button" class="icon-button modal-close" id="modalClose" data-i18n-aria-label="common.cancel">×</button>
      <div class="modal-gallery">
        <button type="button" class="gallery-nav" id="modalPrev">‹</button>
        <img id="modalImage" src="" alt="">
        <button type="button" class="gallery-nav" id="modalNext">›</button>
      </div>
      <div class="modal-thumbs" id="modalThumbs"></div>
      <div class="modal-body">
        <div class="modal-topline">
          <span class="pill" id="modalStatus"></span>
          <p id="modalLocation"></p>
        </div>
        <h3 id="modalTitle"></h3>
        <p class="modal-price" id="modalPrice"></p>
        <div class="modal-grid">
          <section>
            <h4 data-i18n="portal.description"></h4>
            <div id="modalDescription" class="modal-description"></div>
          </section>
          <aside>
            <h4 data-i18n="portal.features"></h4>
            <ul class="fact-list" id="modalFacts"></ul>
            <ul class="feature-list" id="modalFeatures"></ul>
          </aside>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
