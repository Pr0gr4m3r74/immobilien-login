<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Geschützter Zugang zur privaten Immobilienplattform.">
  <title>Login – Private Immobilienplattform</title>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="theme.js"></script>
  <script>
    if (window.App && window.App.hasValidSession()) {
      window.location.replace('geheim.html');
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body class="login-page">
  <div class="login-shell">
    <section class="login-brand-panel">
      <div class="login-brand-panel__content">
        <span class="pill pill--accent" data-i18n="login.eyebrow"></span>
        <h1 id="brandTitle">Private Immobilienplattform</h1>
        <p data-i18n="login.title"></p>
        <p class="muted-copy" data-i18n="login.brandCopy"></p>
        <div class="login-brand-panel__feature-list">
          <div class="feature-chip" data-i18n="login.featureDashboard"></div>
          <div class="feature-chip" data-i18n="login.featureGallery"></div>
          <div class="feature-chip" data-i18n="login.featureAdminWorkflow"></div>
        </div>
      </div>
    </section>

    <main class="login-main-panel">
      <div class="top-actions">
        <button type="button" class="button button--ghost" data-theme-toggle>
          <span>◐</span>
          <span data-theme-label></span>
        </button>
        <label class="language-switch">
          <span data-i18n="common.language"></span>
          <select data-language-select>
            <option value="de">DE</option>
            <option value="en">EN</option>
          </select>
        </label>
      </div>

      <article class="login-card">
        <aside class="demo-ribbon" id="demoRibbon" hidden data-i18n="login.demoRibbon"></aside>
        <div class="login-card__header">
          <span class="login-card__icon">🔐</span>
          <h2 data-i18n="login.title"></h2>
          <p data-i18n="login.subtitle"></p>
        </div>

        <form id="loginForm" class="stack-lg" novalidate>
          <input type="text" name="username" autocomplete="username" class="sr-only" tabindex="-1">
          <div class="field-group">
            <label for="pw" data-i18n="login.passwordLabel"></label>
            <div class="password-field">
              <input id="pw" type="password" autocomplete="current-password" data-i18n-placeholder="login.passwordPlaceholder">
              <button type="button" class="icon-button" id="togglePw" data-i18n-aria-label="login.showPassword">◎</button>
            </div>
          </div>

          <div class="button-grid">
            <button type="submit" class="button button--primary" id="btnCustomer" data-i18n="login.customerButton"></button>
            <button type="button" class="button button--secondary" id="btnAdmin" data-i18n="login.adminButton"></button>
          </div>
        </form>

        <div class="message-box" id="msgBox" role="status" aria-live="polite"></div>
        <p class="security-note" data-i18n="login.securityNote"></p>
        <div class="demo-info" id="demoInfo" hidden data-i18n="login.demoHint"></div>
        <footer class="login-footer" id="loginFooter"></footer>
      </article>
    </main>
  </div>
</body>
</html>
